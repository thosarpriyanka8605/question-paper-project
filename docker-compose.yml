services:
  backend:
    build: ./backend
    container_name: qp-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - backend_output:/app/output
      - backend_database:/app/database
      - backend_models:/app/models
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - FLASK_DEBUG=false

  frontend:
    build: ./frontend
    container_name: qp-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend

volumes:
  backend_output:
  backend_database:
  backend_models:
